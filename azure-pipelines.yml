trigger:
- dev/feature

pool:
  vmImage: 'ubuntu-24.04'

stages:

- stage: CI
  displayName: 'Continuous Integration'

  jobs:

  - job: Build
    displayName: 'Build and Test .NET Application'

    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: |
        dotnet restore DotNetDevOpsDemo.csproj
        dotnet restore Tests/DotNetDevOpsDemo.Tests.csproj
      displayName: 'Restore Dependencies'

    - script: |
        dotnet build DotNetDevOpsDemo.csproj \
          --configuration Release \
          --no-restore
      displayName: 'Build Application'

    - script: |
        dotnet test Tests/DotNetDevOpsDemo.Tests.csproj \
          --configuration Release \
          --no-restore
      displayName: 'Run Tests'

    - script: |
        dotnet publish DotNetDevOpsDemo.csproj \
        --configuration Release \
        --no-build \
        --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish Application'

    - script: |
        rm -rf $(Build.ArtifactStagingDirectory)/publish/Tests
      displayName: 'Remove Test Files'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/publish'
        artifact: 'dotnet-app'
        publishLocation: 'pipeline'

#CD STAGE
- stage: CD
  displayName: 'Continous Deployment'

  dependsOn: CI

  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to Azure App Service'

    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'dotnet-app'
        targetPath: '$(Pipeline.Workspace)/dotnet-app'

    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: 'Azure subscription 1'
        appType: 'webAppLinux'
        appName: 'dotnet-cicd'
        package: '$(Pipeline.Workspace)/dotnet-app'
