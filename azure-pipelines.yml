trigger:
- dev/feature

pool:
  vmImage: 'ubuntu-24.04'

variables:
- group: Dotnet Variable Group

stages:

- stage: CI
  displayName: 'Continuous Integration'

  jobs:

  - job: Build
    displayName: 'Build and Test .NET Application'

    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: |
        dotnet restore DotNetDevOpsDemo.csproj
        dotnet restore Tests/DotNetDevOpsDemo.Tests.csproj
      displayName: 'Restore Dependencies'

    - script: |
        dotnet build DotNetDevOpsDemo.csproj \
          --configuration Release \
          --no-restore
      displayName: 'Build Application'

    - script: |
        dotnet test Tests/DotNetDevOpsDemo.Tests.csproj \
          --configuration Release \
          --no-restore
      displayName: 'Run Tests'

    - script: |
        dotnet publish DotNetDevOpsDemo.csproj \
        --configuration Release \
        --no-build \
        --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish Application'

    - script: |
        rm -rf $(Build.ArtifactStagingDirectory)/publish/Tests
      displayName: 'Remove Test Files'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/publish'
        artifact: 'dotnet-app'
        publishLocation: 'pipeline'

#CD STAGE
- stage: CD
  displayName: 'Continous Deployment'

  dependsOn: CI

  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to Azure App Service'

    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'dotnet-app'
        targetPath: '$(Pipeline.Workspace)/dotnet-app'

    # Inject MySQL variables into App Service
    - task: AzureAppServiceSettings@1
      displayName: 'Configure MySQL Environment Variables'
      inputs:
        azureSubscription: 'Azure subscription 1 (1c727d3e-e7e8-4ba0-b82d-39e5846f228f)'
        appName: 'dotnet-mysql'
        resourceGroupName: 'dotnet-Project'
        appSettings: |
          [
            {
              "name": "MYSQL_SERVER",
              "value": "$(MYSQL_SERVER)",
              "slotSetting": false
            },
            {
              "name": "MYSQL_DATABASE",
              "value": "$(MYSQL_DATABASE)",
              "slotSetting": false
            },
            {
              "name": "MYSQL_USERNAME",
              "value": "$(MYSQL_USERNAME)",
              "slotSetting": false
            },
            {
              "name": "MYSQL_PASSWORD",
              "value": "$(MYSQL_PASSWORD)",
              "slotSetting": false
            }
          ]

    # Deploy application
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: 'Azure subscription 1 (1c727d3e-e7e8-4ba0-b82d-39e5846f228f)'
        appType: 'webAppLinux'
        appName: 'dotnet-mysql'
        package: '$(Pipeline.Workspace)/dotnet-app'
